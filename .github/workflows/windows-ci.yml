name: Nocturne Windows CI

on:
  push:
    paths:
      - "Engine/**"
      - "Apps/NocturneHost/**"
      - "Apps/NocturneEditor/**"
      - "Ide/VS2026/NocturneEngine/**"
      - "Ide/VS2026/NocturneHost/**"
      - "Ide/VS2026/NocturneEditor/**"
      - "Nocturne.slnx"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    paths:
      - "Engine/**"
      - "Apps/NocturneHost/**"
      - "Apps/NocturneEditor/**"
      - "Ide/VS2026/NocturneEngine/**"
      - "Ide/VS2026/NocturneHost/**"
      - "Ide/VS2026/NocturneEditor/**"
      - "Nocturne.slnx"
      - ".github/workflows/windows-ci.yml"

permissions:
  contents: read

jobs:
  phase15-foundation:
    name: Phase 15 — ECS Foundation
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build NocturneHost (Debug x64)
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\"
          $out = "$env:GITHUB_WORKSPACE\Build\CI\bin\"

          msbuild "Ide\VS2026\NocturneHost\NocturneHost.vcxproj" `
            /m `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            "/p:SolutionDir=$root" `
            "/p:OutDir=$out"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run Phase 15 foundation tests
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Build\CI\bin\NocturneHost.exe" --phase15-tests
          exit $LASTEXITCODE

      - name: Build NocturneEditor regression target (Debug x64)
        shell: pwsh
        run: |
          msbuild "Ide\VS2026\NocturneEditor\NocturneEditor.vcxproj" `
            /m `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /p:PlatformToolset=v143

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build Development x64 projects
        shell: pwsh
        run: |
          $projects = @(
            "Ide\VS2026\NocturneEngine\NocturneEngine.vcxproj",
            "Ide\VS2026\NocturneHost\NocturneHost.vcxproj",
            "Ide\VS2026\NocturneEditor\NocturneEditor.vcxproj"
          )

          foreach ($project in $projects) {
            msbuild $project `
              /m `
              /p:Configuration=Development `
              /p:Platform=x64 `
              /p:PlatformToolset=v143

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Build solution regression (Debug x64)
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\"

          msbuild "Nocturne.slnx" `
            /m `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            "/p:SolutionDir=$root"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
