name: Nocturne Release Packaging

on:
  pull_request:
    paths:
      - "Engine/**"
      - "Apps/NocturneHost/**"
      - "Apps/NocturneEditor/**"
      - "Data/**"
      - "Ide/VS2026/NocturneEngine/**"
      - "Ide/VS2026/NocturneHost/**"
      - "Ide/VS2026/NocturneEditor/**"
      - "Schemas/release.schema.json"
      - "Website/src/data/release-schema.mjs"
      - ".github/scripts/package-release.ps1"
      - ".github/workflows/release-package.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic release version without the v prefix"
        required: true
        default: "0.1.0-dev.0"
        type: string
      channel:
        description: "Release channel"
        required: true
        default: development
        type: choice
        options:
          - development
          - preview
          - stable
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  package:
    name: Ship ${{ matrix.architecture }}
    runs-on: windows-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - msbuild_platform: x64
            architecture: x86_64
          - msbuild_platform: Win32
            architecture: x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Resolve candidate version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
            $channel = "${{ inputs.channel }}"
          }
          elseif ("${{ github.event_name }}" -eq "push") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            $channel = if ($version.Contains("-")) { "preview" } else { "stable" }
          }
          else {
            $version = "0.0.0-pr${{ github.event.pull_request.number }}"
            $channel = "development"
          }

          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT

      - name: Build Ship outputs
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\"
          $out = "$env:GITHUB_WORKSPACE\Build\Release\${{ matrix.architecture }}\bin\"

          $projects = @(
            "Ide\VS2026\NocturneEngine\NocturneEngine.vcxproj",
            "Ide\VS2026\NocturneHost\NocturneHost.vcxproj",
            "Ide\VS2026\NocturneEditor\NocturneEditor.vcxproj"
          )

          foreach ($project in $projects) {
            msbuild $project `
              /m `
              /p:Configuration=Ship `
              /p:Platform=${{ matrix.msbuild_platform }} `
              /p:PlatformToolset=v143 `
              "/p:SolutionDir=$root" `
              "/p:OutDir=$out"

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Package release candidate
        id: package
        shell: pwsh
        run: |
          & ".github\scripts\package-release.ps1" `
            -Version "${{ steps.version.outputs.version }}" `
            -Channel "${{ steps.version.outputs.channel }}" `
            -Architecture "${{ matrix.architecture }}" `
            -Platform "${{ matrix.msbuild_platform }}" `
            -BinDir "$env:GITHUB_WORKSPACE\Build\Release\${{ matrix.architecture }}\bin" `
            -DataDir "$env:GITHUB_WORKSPACE\Data" `
            -OutputDir "$env:GITHUB_WORKSPACE\Build\Release\${{ matrix.architecture }}\package" `
            -SourceCommit "${{ github.sha }}" `
            -Repository "${{ github.repository }}"

      - name: Upload packaged candidate
        uses: actions/upload-artifact@v4
        with:
          name: nocturne-release-${{ steps.version.outputs.version }}-windows-${{ matrix.architecture }}
          path: |
            ${{ steps.package.outputs.artifact_path }}
            ${{ steps.package.outputs.checksum_path }}
            ${{ steps.package.outputs.record_path }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged architectures
        uses: actions/download-artifact@v5
        with:
          pattern: nocturne-release-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*.zip release-assets/*.sha256 release-assets/release-record-*.json)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No packaged assets found."
            exit 1
          fi

          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Nocturne Engine ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${assets[@]}"
