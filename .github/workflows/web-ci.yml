name: Nocturne Website CI

on:
  push:
    paths:
      - "Website/**"
      - "Design/**"
      - "Docs/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "Website/**"
      - "Design/**"
      - "Docs/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: write

jobs:
  static-site:
    name: Astro + Starlight static build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Website

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install website dependencies
        run: npm install --no-audit --no-fund

      - name: Commit generated dependency lock once
        if: github.event_name == 'push' && github.ref_name == 'web-docs-foundation'
        working-directory: .
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- Website/package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Website/package-lock.json
            git commit -m "web: lock website dependencies"
            git push origin HEAD:web-docs-foundation
          fi

      - name: Build static website
        run: npm run build

      - name: Verify primary routes
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/download/index.html
          test -f dist/docs/index.html
