name: Nocturne Website CI

on:
  push:
    paths:
      - "Website/**"
      - "Design/**"
      - "Docs/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "Website/**"
      - "Design/**"
      - "Docs/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  static-site:
    name: Astro + Starlight static build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Website

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Website/package-lock.json

      - name: Install website dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static website
        run: npm run build

      - name: Verify website routes and canonical docs
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/download/index.html
          test -f dist/docs/index.html
          test -f dist/404.html

          test -f dist/docs/architecture/overview/index.html
          test -f dist/docs/systems/runtime/index.html
          test -f dist/docs/systems/resources/index.html
          test -f dist/docs/systems/rendering/index.html
          test -f dist/docs/systems/world-ecs/index.html
          test -f dist/docs/systems/editor/index.html
          test -f dist/docs/development/documentation-model/index.html
          test -f dist/docs/development/production-engineering-standard/index.html
          test -f dist/docs/development/website-specification/index.html
          test -f dist/docs/history/index.html

          grep -q "noc.runtime" dist/docs/systems/runtime/index.html
          grep -q "noc.resources" dist/docs/systems/resources/index.html
          grep -q "noc.render" dist/docs/systems/rendering/index.html
          grep -q "noc.world" dist/docs/systems/world-ecs/index.html
          grep -q "noc.editor" dist/docs/systems/editor/index.html

          test -f dist/icons/box.svg
          test -f dist/icons/device-desktop.svg
          test -f dist/icons/world.svg
          test -f dist/icons/hierarchy-2.svg
          test -f dist/icons/layout-grid.svg
          test -f dist/icons/terminal-2.svg
          test -f dist/icons/file-text.svg

          grep -q "EditorShellV3" dist/index.html
          grep -q "Interface schematic" dist/index.html
          grep -q "Phases 1–15 implemented" dist/index.html
          grep -q "noc.runtime" dist/index.html
          grep -q "noc.resources" dist/index.html
          grep -q "noc.render" dist/index.html
          grep -q "noc.world" dist/index.html
          grep -q "noc.editor" dist/index.html
          grep -q "Skip to content" dist/index.html
